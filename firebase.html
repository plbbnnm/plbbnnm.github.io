<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Студенты</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 20px auto; }
    form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    label { font-size: 14px; }
    input, button { padding: 8px; font-size: 14px; }
    button { cursor: pointer; }
    .student { padding: 8px 0; }
    hr { border: none; border-top: 1px solid #ddd; }
  </style>
</head>
<body>

<!-- Кнопка для входа -->
<button onclick="signInWithGitHub()">Войти через GitHub</button>
<div id="greeting" style="margin-top: 10px; font-weight: bold; color: green;"></div>

  <!-- ФОРМА -->
  <form id="student-form">
    <label>Имя
      <input type="text" id="name" required>
    </label>
    <label>Специальность
      <input type="text" id="major" required>
    </label>
    <label>Год выпуска
      <input type="number" id="gradYear" required>
    </label>
    <button type="submit">Добавить студента</button>
  </form>

  <!-- ОБЛАСТЬ ОТОБРАЖЕНИЯ -->
  <div id="student-display">Загрузка...</div>

  <!-- 1. Подключаем Compat-скрипты (обычные, не module) -->
  <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-analytics-compat.js"></script>

  <!-- 2. Обычный скрипт (без type="module") -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD3MQWSjZ6ie78R4C50led6lszWik7fUCo",
      authDomain: "college-de6c8.firebaseapp.com",
      databaseURL: "https://college-de6c8-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "college-de6c8",
      storageBucket: "college-de6c8.firebasestorage.app",
      messagingSenderId: "861971217667",
      appId: "1:861971217667:web:0db8cf6fa388e030f2fd36",
      measurementId: "G-QK3D6VZ86W"
    };

    // Инициализация
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();

    const studentsRef = database.ref('students');

    // --- ОБРАБОТКА ФОРМЫ ---
    const form = document.getElementById('student-form');
    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const major = document.getElementById('major').value.trim();
      const gradYear = Number(document.getElementById('gradYear').value);

      if (!name || !major || !gradYear) return;

      const newStudentRef = studentsRef.push();
      newStudentRef.set({ name, major, gradYear })
        .then(() => {
          form.reset();
          console.log("Insert success!");
        })
        .catch((error) => {
          console.error("Database write error:", error);
          alert("Не удалось сохранить: " + error.message);
        });
    });

    // --- ОТОБРАЖЕНИЕ ВСЕХ В РЕАЛЬНОМ ВРЕМЕНИ ---
    const displayElement = document.getElementById('student-display');

    studentsRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        displayElement.textContent = "Студентов нет.";
        return;
      }

      const html = Object.entries(data).map(([key, s]) => `
        <div class="student">
          <p><strong>Имя:</strong> ${s.name ?? '-'}</p>
          <p><strong>Специальность:</strong> ${s.major ?? '-'}</p>
          <p><strong>Год выпуска:</strong> ${s.gradYear ?? '-'}</p>
        </div>
        <hr>
      `).join('');

      displayElement.innerHTML = html;
    }, (error) => {
      console.error("Ошибка чтения:", error);
      displayElement.textContent = "Ошибка загрузки данных.";
    });

    // --- АВТОРИЗАЦИЯ ЧЕРЕЗ GITHUB ---
    const provider = new firebase.auth.GithubAuthProvider();
    provider.addScope('user:email');

    // Теперь это обычная функция, и onclick её видит
    function signInWithGitHub() {
  auth.signInWithPopup(provider)
    .then((result) => {
      const user = result.user;
      console.log("Пользователь вошел:", user.displayName);
      
      // --- ИЗМЕНЕНИЯ ЗДЕСЬ ---
      // Берем имя из GitHub. Если его нет, берем email или часть до @
      let name = user.displayName;
      
      // Если GitHub не вернул имя, пробуем взять email до собачки
      if (!name && user.email) {
        name = user.email.split('@')[0];
      }
      if (!name) {
         name = "гость"; // на всякий случай
      }

      // Выводим текст в наш новый div вместо alert
      document.getElementById('greeting').textContent = `Привет, ${name}!`;
      // ----------------------
      
    })
    .catch((error) => {
      console.error("Ошибка авторизации:", error.message);
      // Вместо alert при ошибке тоже можно вывести текст, но оставим alert для ошибок
      alert("Не удалось войти: " + error.message); 
    });
}
  </script>

</body>
</html>
